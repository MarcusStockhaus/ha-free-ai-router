id: openrouter
name: OpenRouter
api_style: openai_compatible
base_url: https://openrouter.ai/api/v1
auth:
  type: bearer
extra_headers:
  HTTP-Referer: https://github.com/home-assistant-free-ai-router
  X-Title: Home Assistant Free AI Router

# Ausdruecklich Reserve, nicht erste Wahl.
preference: 90
limits_scope: per_key
daily_reset_timezone: UTC

onboarding:
  signup_url: https://openrouter.ai/settings/keys
  summary_de: >-
    Vision-Reserve außerhalb von Google. Ohne einmalige 10-Dollar-Aufladung
    nur 50 Anfragen pro Tag — als tragende Säule zu wenig, als Ausweichkanal
    brauchbar.
  steps_de:
    - Konto anlegen und anmelden
    - '"Create Key" klicken, Limit leer lassen'
    - Key kopieren und hier einfügen
  data_note_de: >-
    Kein Training auf Inhalten, sofern in den Kontoeinstellungen nicht
    ausdrücklich erlaubt. Der jeweilige Modellanbieter sieht die Daten.
  credit_card_required: false

# Modellbestand am 09.09.2026 ueber /models abgeglichen: von 430 Modellen
# tragen 18 den Zusatz :free. Die Limits gelten je Schluessel ueber alle
# Modelle hinweg, nicht je Modell.
#
# Am 09.09.2026 gemessen und deshalb *nicht* eingetragen:
#   thinkingmachines/inkling:free  -> 403, nur mit Agent-Tarif
#   google/gemma-4-*:free          -> 429 beim Upstream; direkt bei Google
#                                     ist dasselbe Modell ohnehin besser
#                                     erreichbar
models:
  - id: nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free
    label: Nemotron 3 Nano Omni (free)
    profiles: [vision]
    latency_class: langsam
    capabilities:
      vision: true
      tools: false
      structured_output: true
      context_tokens: 131072
    limits:
      rpm: 20
      rpd: 50

  - id: nvidia/nemotron-3.5-lightning:free
    label: Nemotron 3.5 Lightning (free)
    profiles: [schnell]
    latency_class: schnell
    capabilities:
      vision: false
      tools: true
      structured_output: true
      context_tokens: 131072
    limits:
      rpm: 20
      rpd: 50
