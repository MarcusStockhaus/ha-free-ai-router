id: google_ai_studio
name: Google AI Studio
api_style: google
base_url: https://generativelanguage.googleapis.com/v1beta
auth:
  type: header
  name: x-goog-api-key

# Redaktionelle Rangfolge, kleiner = frueher (Erste Wahl fuer Bildanalyse).
preference: 10
limits_scope: per_model
daily_reset_timezone: America/Los_Angeles

onboarding:
  signup_url: https://aistudio.google.com/apikey
  summary_de: >-
    Trägt die Bildanalyse. Achtung: nur die Flash-Lite-Modelle haben ein
    brauchbares Tagesbudget, die großen Flash-Modelle nur 20 Anfragen/Tag.
  summary_en: >-
    Carries image analysis. Note: only the Flash-Lite models have a usable
    daily budget; the larger Flash models allow just 20 requests per day.
  steps_de:
    - Mit Google-Konto anmelden
    - '"Create API key" klicken'
    - Key kopieren und hier einfügen
  steps_en:
    - Sign in with a Google account
    - Click "Create API key"
    - Copy the key and paste it here
  data_note_de: >-
    Kostenlose Stufe: Inhalte werden zur Produktverbesserung genutzt.
    Kamerabilder verlassen damit die EU.
  data_note_en: >-
    Free tier: content is used to improve Google's products. Camera images
    therefore leave the EU.
  credit_card_required: false
  empfohlen: true

# Alle Limits am 09.09.2026 aus dem AI-Studio-Dashboard eines echten Kontos
# abgelesen, nicht aus der Dokumentation. Google nennt dort selbst keine
# Zahlen mehr. Die Werte koennen nach Kontoalter und Region abweichen — was
# das Capability-Modul misst und ein eigener 429 sagen, gewinnt.
models:
  # --- Die beiden Arbeitspferde: 500 Anfragen/Tag, 15/Minute -------------
  - id: gemini-3.5-flash-lite
    label: Gemini 3.5 Flash-Lite
    profiles: [schnell, vision]
    latency_class: schnell
    capabilities:
      vision: true
      tools: true
      structured_output: true
      context_tokens: 1000000
    limits:
      rpm: 15
      rpd: 500
      tpm: 250000

  - id: gemini-3.1-flash-lite
    label: Gemini 3.1 Flash-Lite
    profiles: [schnell, vision]
    latency_class: schnell
    capabilities:
      vision: true
      tools: true
      structured_output: true
      context_tokens: 1000000
    limits:
      rpm: 15
      rpd: 500
      tpm: 250000

  # --- Tiefenpuffer: 14.400 Anfragen/Tag, dafuer nur 16k Token/Minute ----
  # Gemma nimmt Bilder an und erkennt sie richtig. Schema lieferte es am 09.
  # und 10.09.2026 nicht (leere Antwort statt JSON); am 24.09.2026 meldeten der
  # taegliche Prober und die eigene Messung in Home Assistant uebereinstimmend
  # Schema und Werkzeuge fuer die 31B-Variante. Die
  # 26B-Variante kann Werkzeuge, Schema weiterhin nicht.
  # Unzuverlaessig: die 31B-Variante braucht bis zu 30 s und faellt oefter mit
  # HTTP 500 aus. Im Profil "schnell" ordnet der Router sie deshalb nach hinten.
  - id: gemma-4-31b-it
    label: Gemma 4 31B
    profiles: [vision, schnell]
    latency_class: langsam
    capabilities:
      vision: true
      tools: true
      structured_output: true
      context_tokens: 262144
    limits:
      rpm: 30
      rpd: 14400
      tpm: 16000

  - id: gemma-4-26b-a4b-it
    label: Gemma 4 26B
    profiles: [vision, schnell]
    latency_class: schnell
    capabilities:
      vision: true
      tools: true
      structured_output: false
      context_tokens: 262144
    limits:
      rpm: 30
      rpd: 14400
      tpm: 16000

  # --- Qualitaetsstufe mit winzigem Budget: 20 Anfragen/Tag -------------
  # Fuer seltene Aufgaben (Automationsvorschlag, schwierige Szene), nicht
  # fuer Kameraauswertung im Minutentakt.
  - id: gemini-3.5-flash
    label: Gemini 3.5 Flash
    profiles: [reasoning, vision]
    latency_class: normal
    capabilities:
      vision: true
      tools: true
      structured_output: true
      context_tokens: 1000000
    limits:
      rpm: 5
      rpd: 20
      tpm: 250000

  - id: gemini-3.8-flash
    label: Gemini 3.8 Flash
    profiles: [reasoning]
    latency_class: normal
    capabilities:
      vision: true
      tools: true
      structured_output: true
      context_tokens: 1000000
    limits:
      rpm: 5
      rpd: 20
      tpm: 250000
