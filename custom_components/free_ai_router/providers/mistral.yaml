id: mistral
name: Mistral
api_style: openai_compatible
base_url: https://api.mistral.ai/v1
auth:
  type: bearer

preference: 50
monthly_budget_usd: 10
limits_scope: per_model
daily_reset_timezone: UTC

onboarding:
  signup_url: https://console.mistral.ai/api-keys
  summary_de: >-
    Sehr großes Minutenkontingent gegen Datenfreigabe, gedeckelt auf 10 Dollar
    API-Nutzung im Monat. Schnell und schemafest, sieht auch Bilder.
  steps_de:
    - Auf console.mistral.ai anmelden
    - Telefonnummer bestätigen — ohne das bleibt die kostenlose Stufe zu
    - 'Das *API*-Abonnement mit Plan FREE aktivieren. Nicht zu verwechseln mit Le Chat oder Labs: Mistral führt drei getrennte Produktlinien, und nur das API-Abo schaltet die Chat-Modelle frei'
    - 'Unter "API Keys" auf "Create new key", Ablaufdatum setzen, Key kopieren'
  data_note_de: >-
    Die kostenlose Stufe verlangt die Zustimmung, dass Inhalte zum Training
    verwendet werden. Kamerabilder gehen damit in die Modellentwicklung ein.
    Die Nutzung ist außerdem auf 10 Dollar im Monat gedeckelt.
  credit_card_required: false

# Limits am 10.09.2026 aus admin.mistral.ai/plateforme/limits abgelesen,
# Anfragen je Sekunde in RPM umgerechnet. Mistral nennt dort kein Tageslimit,
# nur Minuten- und Monatsfenster — rpd bleibt deshalb leer, also unbekannt.
#
# ACHTUNG, andere Art von Grenze: die kostenlose Stufe ist zusaetzlich auf
# 10 Dollar API-Nutzung im Monat gedeckelt (monthly_budget_usd). Das ist kein
# Zeitfenster, sondern ein Ausgabendeckel — der Ledger kann ihn mit Anfragen-
# und Tokenzaehlern nicht fuehren; das loest erst Phase 4.
#
# Preise am 10.09.2026 von mistral.ai/pricing/api, zugeordnet ueber den
# Modellnamen, nicht ueber die gepinnte Version. Was das praktisch heisst, bei
# rund 1.300 Token je Kameraanalyse:
#
#   ministral-3b    0,00013 $  ->  rund 2.560 Analysen am Tag im Deckel
#   ministral-8b    0,00020 $  ->  rund 1.710 am Tag
#   mistral-small   0,00024 $  ->  rund 1.390 am Tag
#   codestral       0,00045 $  ->  rund   740 am Tag
#
# Der Deckel ist damit kein Papiertiger, aber auch keine Mauer: er verdoppelt
# die Kapazitaet der ungedeckelten Kanaele etwa, statt sie zu ersetzen.
# Deshalb bleibt preference 50: erst die ungedeckelten, dann dieser.
#
# WICHTIG: hier stehen *gepinnte* Versionen, keine -latest-Aliase. Die Aliase
# zeigen auf Versionen, fuer die die Organisation keine Zuteilung hat; sie
# antworteten mit 429 und x-ratelimit-limit-req-minute: 0, waehrend dieselben
# Modelle unter der gepinnten Version in der Limit-Tabelle stehen. Das ist der
# Preis der Stabilitaet: ein Alias veraltet nicht, aber er zeigt auch dorthin,
# wo man nichts darf.
models:
  # 12,5 Anfragen je Sekunde und 1,3 Mio. Token je Minute — das mit Abstand
  # groesste Minutenfenster im ganzen Feld.
  #
  # Sieht Bilder — das war zwischenzeitlich anders eingetragen, und der Irrtum
  # lag am Testbild, nicht am Modell. Ministral nannte Tuerkis verlaesslich
  # "hellblau", und weil darin "blau" steckt, zaehlte die Runde als falsch
  # benannte Fremdfarbe. Seit Tuerkis aus der Palette raus ist (11.09.2026),
  # treffen 8B fuenf und 3B vier von sechs Runden; die Fehlschlaege sind
  # Benennungen wie "Gelb" fuer Orange, keine Blindheit.
  #
  # Trotzdem steht `vision` **nicht** in den Profilen. Das ist keine technische
  # Aussage, sondern eine ueber die Daten: Mistrals kostenlose Stufe verlangt
  # die Zustimmung zum Training auf Inhalten. Wer diese Modelle fuer
  # Kamerabilder freigibt, gibt die Bilder in die Modellentwicklung. Diese
  # Entscheidung gehoert dem Betreiber der Installation, nicht dieser Datei —
  # wer sie treffen will, ergaenzt `vision` in `profiles`.
  - id: ministral-3b-2512
    label: Ministral 3B
    profiles: [schnell]
    latency_class: sehr_schnell
    capabilities:
      vision: true
      tools: true
      structured_output: true
      context_tokens: 131072
    limits:
      rpm: 750
      tpm: 1300000
    pricing:
      input_per_mtok: 0.10
      output_per_mtok: 0.10

  - id: ministral-8b-2512
    label: Ministral 8B
    profiles: [schnell]
    latency_class: sehr_schnell
    capabilities:
      vision: true
      tools: true
      structured_output: true
      context_tokens: 131072
    limits:
      rpm: 188
      tpm: 625000
    pricing:
      input_per_mtok: 0.15
      output_per_mtok: 0.15

  # Steht in der Limit-Tabelle des Kontos, antwortet aber mit 429 und
  # x-ratelimit-limit-req-minute: 0. Auch mit dem kostenlosen *Le-Chat*-Tarif
  # bleibt es zu — der schaltet keine API-Modelle frei, dafuer braucht es das
  # eigene API-Abonnement (APIPlan FREE). Bleibt drin, weil es damit der
  # Vision-Kanal der Mistral-Linie waere; die Faehigkeitsmessung schaltet es
  # sonst ab.
  #
  # Nicht mehr eingetragen: mistral-large-2512 — "This model is not available
  # in your subscription", und /models fuehrt es gar nicht.
  - id: mistral-small-2603
    label: Mistral Small
    profiles: [schnell, vision]
    latency_class: schnell
    capabilities:
      vision: true
      tools: true
      structured_output: true
      context_tokens: 131072
    limits:
      rpm: 60
      tpm: 20000
    pricing:
      input_per_mtok: 0.15
      output_per_mtok: 0.60

  - id: codestral-2508
    label: Codestral
    profiles: [reasoning]
    latency_class: schnell
    capabilities:
      vision: false
      tools: true
      structured_output: true
      context_tokens: 262144
    limits:
      rpm: 125
      tpm: 625000
    pricing:
      input_per_mtok: 0.30
      output_per_mtok: 0.90
