id: groq
name: Groq
api_style: openai_compatible
base_url: https://api.groq.com/openai/v1
auth:
  type: bearer

# Redaktionelle Rangfolge, kleiner = frueher (Erste Wahl fuer Assist).
preference: 20
limits_scope: per_model
daily_reset_timezone: UTC

onboarding:
  signup_url: https://console.groq.com/keys
  summary_de: >-
    Latenz-König, erste Wahl für Assist. Qwen3.8 kann entgegen der
    verbreiteten Annahme auch Bilder.
  empfohlen: true
  steps_de:
    - Mit GitHub- oder Google-Konto anmelden
    - '"Create API Key" klicken und einen Namen vergeben'
    - Key sofort kopieren, er wird nur einmal angezeigt
  data_note_de: >-
    Kein Training auf Inhalten der kostenlosen Stufe.
  credit_card_required: false

# Modellbestand am 09.09.2026 ueber /models abgeglichen. Die Llama-Modelle
# fuehrt Groq nicht mehr. Limits aus den gemessenen x-ratelimit-*-Headern:
# 1.000 Anfragen/Tag, aber nur 8.000 Token/Minute — bei rund 1.200 Token je
# Anfrage bindet das Tokenfenster lange vor dem Anfragenfenster.
models:
  - id: openai/gpt-oss-20b
    label: GPT-OSS 20B
    profiles: [schnell]
    latency_class: sehr_schnell
    capabilities:
      vision: false
      tools: true
      structured_output: true
      context_tokens: 131072
    limits:
      rpm: 30
      rpd: 1000
      tpm: 8000

  # Gemessen am 09.09.2026: nimmt Bilder an *und* erkennt sie richtig.
  # Damit haengt die Bildanalyse nicht mehr allein an Google — der haerteste
  # Punkt des urspruenglichen Entwurfs.
  - id: qwen/qwen3.8-27b
    label: Qwen3.8 27B
    profiles: [schnell, reasoning, vision]
    latency_class: sehr_schnell
    capabilities:
      vision: true
      tools: true
      structured_output: true
      context_tokens: 131072
    limits:
      rpm: 30
      rpd: 1000
      tpm: 8000

  - id: openai/gpt-oss-120b
    label: GPT-OSS 120B
    profiles: [reasoning]
    latency_class: schnell
    capabilities:
      vision: false
      tools: true
      structured_output: true
      context_tokens: 131072
    limits:
      rpm: 30
      rpd: 1000
      tpm: 8000
