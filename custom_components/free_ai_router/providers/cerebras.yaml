id: cerebras
name: Cerebras
api_style: openai_compatible
base_url: https://api.cerebras.ai/v1
auth:
  type: bearer

# Zweitkanal fuer Assist, direkt hinter Groq.
preference: 40
limits_scope: per_model
daily_reset_timezone: UTC

onboarding:
  signup_url: https://cloud.cerebras.ai/platform/apikeys
  summary_de: >-
    Sehr schnelle Inferenz und mit Abstand das groesste Kontingent.
    Qwen3.8 nimmt auch Bilder an.
  steps_de:
    - Bei Cerebras Cloud mit Google- oder GitHub-Konto anmelden
    - 'Unter "Billing" pruefen, ob ein Tarif aktiv ist — ohne das antwortet die API mit 402, obwohl der Key gueltig ist'
    - Links im Menue auf "API Keys" gehen
    - '"Generate API Key" klicken, Namen vergeben, Key kopieren'
  data_note_de: >-
    Kein Training auf Inhalten der kostenlosen Stufe.
  credit_card_required: false

# Limits am 09.09.2026 aus der Limits-Seite des eigenen Kontos abgelesen.
#
# Als tpm ist bewusst das *Uncached*-Tokenfenster eingetragen, nicht das
# Gesamtfenster: diese Integration schickt jedes Mal ein frisches Kamerabild,
# da greift keine Zwischenspeicherung. Das Gesamtfenster waere die
# schmeichelhaftere Zahl und die falsche.
models:
  # Das mit Abstand groesste Kontingent im ganzen Feld: 450 Anfragen pro
  # Minute, 648.000 pro Tag — und es nimmt bis zu 10 Bilder je Anfrage.
  - id: qwen-3.8-27b
    label: Qwen3.8 27B
    profiles: [schnell, reasoning, vision]
    latency_class: sehr_schnell
    capabilities:
      vision: true
      tools: true
      structured_output: true
      context_tokens: 131072
    limits:
      rpm: 450
      rpd: 648000
      tpm: 150000

  - id: gpt-oss-120b
    label: GPT-OSS 120B
    profiles: [reasoning]
    latency_class: sehr_schnell
    capabilities:
      vision: false
      tools: true
      structured_output: true
      context_tokens: 131000
    limits:
      rpm: 5
      rpd: 2400
      tpm: 30000

  # Als Preview gefuehrt und beim ersten Messversuch mit 404 "do not have
  # access" abgewiesen, obwohl die Limits-Seite es auflistet. Bleibt drin,
  # weil die Faehigkeitsmessung es abschaltet, wenn es weiterhin nicht geht.
  - id: gemma-4-31b
    label: Gemma 4 31B (Preview)
    profiles: [vision, schnell]
    latency_class: sehr_schnell
    capabilities:
      vision: true
      tools: false
      structured_output: true
      context_tokens: 131072
    limits:
      rpm: 5
      rpd: 2400
      tpm: 30000
