name: Feed-Prober

# Der Feed-Dienst besteht aus diesem Workflow und einem Zweig. Kein Server,
# keine Datenbank, kein Endpunkt, der etwas entgegennimmt: der Prober misst,
# schreibt statische Dateien, signiert sie und legt sie auf den Zweig `feed`.
#
# Ausgeliefert wird ueber GitHub Pages aus diesem Zweig. Pages kennt bei der
# Auslieferung aus einem Zweig nur zwei moegliche Ordner, die Wurzel und
# `/docs` — deshalb `docs`. Die Zustandsdatei liegt bewusst darueber in der
# Wurzel: sie gehoert zur Buchfuehrung und nicht zur Auslieferung.
#
# Der Zeitplan faehrt **einmal am Tag** alles. Das ist keine Sparmassnahme,
# sondern die passende Aufloesung:
#
#   * Der Client sieht ohnehin nur alle FEED_INTERVAL_HOURS nach. Stuendlich
#     zu veroeffentlichen hiesse, 24 Dokumente fuer sechs Abrufe zu bauen.
#   * Tot wird ein Modell nach DEAD_AFTER_FAILURES Laeufen in Folge.
#     Stuendlich waeren das drei Stunden — eine Stoerung wie die von Googles
#     Gemma am 11.09.2026 haette gereicht. Taeglich sind es drei Tage, und
#     drei Tage Dauerausfall sind ein Signal, eine schlechte Viertelstunde
#     nicht.
#   * Je Modell drosselt sich der Prober zusaetzlich am Tageskontingent.
#
# `--cheap` bleibt als Handgriff fuer zwischendurch: workflow_dispatch ohne
# Haken faehrt nur die Lebendigkeit.
#
# Laeuft nur nach Zeitplan oder von Hand. Niemals bei einem Pull Request: der
# hier verwendete Schluessel gehoert dem Proberkonto, und ein fremder PR darf
# ihn nicht zu sehen bekommen.

on:
  schedule:
    - cron: "7 3 * * *"    # taeglich 03:07 UTC, alles
  workflow_dispatch:
    inputs:
      full:
        description: "Alle Pruefungen statt nur Lebendigkeit"
        type: boolean
        default: false

permissions:
  contents: write

# Zwei gleichzeitige Laeufe wuerden sich die Zustandsdatei gegenseitig
# ueberschreiben. Warten statt abbrechen: ein verlorener Lauf ist eine Luecke
# in der Buchfuehrung ueber Ausfaelle.
concurrency:
  group: feed-prober
  cancel-in-progress: false

jobs:
  probe:
    name: Messen und veroeffentlichen
    runs-on: ubuntu-latest
    steps:
      - name: Ist der Dienst ueberhaupt eingerichtet?
        run: |
          if [ -z "${{ secrets.FAR_FEED_PRIVATE_KEY }}" ]; then
            echo "::error::Kein FAR_FEED_PRIVATE_KEY gesetzt — der Prober kann nichts signieren."
            echo "Einrichtung: siehe FEED.md, Abschnitt 'Den Prober betreiben'."
            exit 1
          fi

      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install aiohttp PyYAML cryptography

      - name: Zweig 'feed' bereitstellen
        run: |
          git config user.name "feed-prober"
          git config user.email "feed-prober@users.noreply.github.com"
          if git ls-remote --exit-code origin feed >/dev/null 2>&1; then
            git fetch --depth=1 origin feed
            git worktree add feed-data origin/feed
          else
            # Erster Lauf: der Zweig entsteht leer und ohne Vorgeschichte.
            git worktree add --detach feed-data
            cd feed-data
            git checkout --orphan feed
            git rm -rf . >/dev/null 2>&1 || true
          fi

      - name: Prober
        id: prober
        env:
          FAR_FEED_PRIVATE_KEY: ${{ secrets.FAR_FEED_PRIVATE_KEY }}
          FAR_KEY_GOOGLE_AI_STUDIO: ${{ secrets.FAR_KEY_GOOGLE_AI_STUDIO }}
          FAR_KEY_GROQ: ${{ secrets.FAR_KEY_GROQ }}
          FAR_KEY_MISTRAL: ${{ secrets.FAR_KEY_MISTRAL }}
          FAR_KEY_OPENROUTER: ${{ secrets.FAR_KEY_OPENROUTER }}
        run: |
          if [ -n "${{ github.event.schedule }}" ] || [ "${{ inputs.full }}" = "true" ]; then
            takt=--full
          else
            takt=--cheap
          fi
          echo "Takt: $takt"

          set +e
          python tools/prober.py "$takt" \
            --state feed-data/feed-state.json \
            --out feed-data/docs \
            --env /nonexistent

          # Ohne diese Datei schiebt Pages alles durch Jekyll, und eine
          # Datei mit fuehrendem Unterstrich waere stillschweigend nicht
          # abrufbar.
          touch feed-data/docs/.nojekyll
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"

          # 3 = kein Modell hat geantwortet, es wurde nichts geschrieben.
          # 4 = ein Schluessel wurde abgelehnt; das Ergebnis ist trotzdem
          #     brauchbar und soll veroeffentlicht werden. Der Lauf faellt
          #     dafuer am Ende auf rot.
          if [ "$code" -ne 0 ] && [ "$code" -ne 4 ]; then
            exit "$code"
          fi

      - name: Veroeffentlichen
        working-directory: feed-data
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "Nichts geaendert."
            exit 0
          fi
          git commit -m "Feed vom $(date -u +%Y-%m-%dT%H:%MZ)"
          git push origin HEAD:feed

      - name: Abgelehnter Schluessel faellt auf
        if: steps.prober.outputs.code == '4'
        run: |
          echo "::error::Mindestens ein Anbieter hat den Proberschluessel abgelehnt."
          echo "Der Feed wurde trotzdem veroeffentlicht — die betroffenen Kanaele"
          echo "sind darin unveraendert und nicht totgemeldet. Schluessel erneuern."
          exit 1
